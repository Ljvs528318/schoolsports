{% extends "base.html" %}
{% block title %}个人资料{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow">
      <div class="card-header"><i class="bi bi-person-circle me-2"></i>个人资料</div>
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3 text-center">
            {% if current_user.avatar %}
            <img src="{{ url_for('static', filename=current_user.avatar) }}" alt="头像"
                 style="width:80px;height:80px;object-fit:cover" class="rounded-circle mb-2">
            {% else %}
            <i class="bi bi-person-circle display-1 text-muted"></i>
            {% endif %}
            <div>
              <label class="btn btn-sm btn-outline-primary">
                <i class="bi bi-camera me-1"></i>更换头像
                <input type="file" name="avatar" class="d-none"
                       accept="image/png,image/jpeg,image/gif,image/webp">
              </label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">用户名</label>
            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold">真实姓名</label>
              <input type="text" name="real_name" class="form-control" value="{{ current_user.real_name or '' }}">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">学号/工号</label>
              <input type="text" name="student_id" class="form-control" value="{{ current_user.student_id or '' }}">
            </div>
          </div>
          <div class="row g-3 mt-0">
            <div class="col-6">
              <label class="form-label fw-semibold">班级/部门</label>
              <input type="text" name="class_name" class="form-control" value="{{ current_user.class_name or '' }}">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">手机号</label>
              <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
            </div>
          </div>
          <hr>
          <h6 class="text-muted">修改密码（不修改留空）</h6>
          <div class="mb-3">
            <label class="form-label">原密码</label>
            <input type="password" name="old_password" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">新密码</label>
            <input type="password" name="new_password" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">保存修改</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

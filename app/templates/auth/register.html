{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4 text-center"><i class="bi bi-person-plus me-2 text-primary"></i>注册账号</h4>
        <form method="post">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold">用户名 <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">真实姓名</label>
              <input type="text" name="real_name" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">邮箱 <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">学号/工号</label>
              <input type="text" name="student_id" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">班级/部门</label>
              <input type="text" name="class_name" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">手机号</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">密码 <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">确认密码 <span class="text-danger">*</span></label>
              <input type="password" name="confirm" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">注册</button>
        </form>
        <div class="text-center mt-2 small">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-trophy-fill" style="font-size:3rem;color:#1565c0"></i>
          <h4 class="mt-2 fw-bold">登录系统</h4>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">用户名</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">密码</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="remember" id="remember">
            <label class="form-check-label" for="remember">记住我</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">登录</button>
        </form>
        <div class="text-center mt-3 small">
          还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
        </div>
        <div class="text-center mt-1 small text-muted">
          管理员默认账号：admin / admin123
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
